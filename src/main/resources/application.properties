
spring.application.name=training
spring.profiles.default=dev

# API Versioning
api.version=/api/v1

# JWT
app.security.jwt.secret=exgym-training-program-jwt-secret-key-change-this-in-real-environments-2026
app.security.jwt.expiration=3600000
# Shared secret for inter-service JWT authentication (must match app.jwt.secret in workload service)
app.security.interservice.jwt.secret=exgymJwtSharedSecretKeyMustBeAtLeast32Chars!

# CORS
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging configuration
logging.level.com.exgym.training=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] - %logger{36} - %msg%n

# Datasource
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

# Hibernate properties
spring.jpa.properties.hibernate.default_schema=exgym
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
# TEMP: recreate schema on startup to apply constraint changes; switch back to update after reset
spring.jpa.hibernate.ddl-auto=create

# SpringDoc OpenAPI/Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# Enable proper 404 handling for non-existing endpoints
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Workload Service integration
workload.service.url=http://exgymworkload
workload.service.api.path=/api/v1/trainers/workload

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.workload-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.workload-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.workload-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.workload-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.workload-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.workload-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.workload-service.register-health-indicator=true
