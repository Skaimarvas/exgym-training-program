
spring.application.name=training
spring.profiles.default=local

# API Versioning
api.version=/api/v1

# JWT
app.security.jwt.secret=exgym-training-program-jwt-secret-key-change-this-in-real-environments-2026
app.security.jwt.expiration=3600000

# CORS
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging configuration
logging.level.com.exgym.training=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] - %logger{36} - %msg%n

# Datasource
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
# Hibernate properties
spring.jpa.properties.hibernate.default_schema=exgym
spring.jpa.show-sql=true
# TEMP: recreate schema on startup to apply constraint changes; switch back to update after reset
spring.jpa.hibernate.ddl-auto=create

# SpringDoc OpenAPI/Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# Enable proper 404 handling for non-existing endpoints
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false