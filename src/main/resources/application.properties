
spring.application.name=training

# Active profile (default: local)
spring.profiles.active=local

# Logging configuration
logging.level.com.exgym.training=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] - %logger{36} - %msg%n

# Datasource
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
# Hibernate properties
spring.jpa.properties.hibernate.default_schema=exgym
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# SpringDoc OpenAPI/Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.health.defaults.enabled=true

# Custom application info
info.app.name=ExGym Training Program
info.app.description=Spring Boot REST API for gym training management
info.app.version=@project.version@