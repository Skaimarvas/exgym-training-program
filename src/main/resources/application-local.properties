# Local Environment Configuration
spring.config.activate.on-profile=local

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:exgym_local;MODE=PostgreSQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Logging
logging.level.com.exgym.training=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator
management.endpoint.health.show-details=always

# Disable Eureka for local dev (no discovery service running)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Workload Service - direct URL (no Eureka)
workload.service.url=http://localhost:8082
