# Production Environment Configuration
spring.config.activate.on-profile=prod

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://prod-db-server:5432/exgym_prod
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=exgym_prod_user
spring.datasource.password=exgym_prod_password

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.com.exgym.training=WARN
logging.level.org.springframework=ERROR

# Actuator - Restrict exposure in production
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
