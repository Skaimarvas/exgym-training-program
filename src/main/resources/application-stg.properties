# Staging Environment Configuration
spring.config.activate.on-profile=stg

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://staging-db-server:5432/exgym_stg
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=exgym_stg_user
spring.datasource.password=exgym_stg_password

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging
logging.level.com.exgym.training=INFO
logging.level.org.springframework=WARN
