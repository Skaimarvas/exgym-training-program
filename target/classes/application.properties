
spring.application.name=training

# API Versioning
api.version=/api/v1

# Logging configuration
logging.level.com.exgym.training=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] - %logger{36} - %msg%n

# Datasource
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
# Hibernate properties
spring.jpa.properties.hibernate.default_schema=exgym
spring.jpa.show-sql=true
# TEMP: recreate schema on startup to apply constraint changes; switch back to update after reset
spring.jpa.hibernate.ddl-auto=create

# SpringDoc OpenAPI/Swagger configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Enable proper 404 handling for non-existing endpoints
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false